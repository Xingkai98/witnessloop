name: witnessloop gate

# reusable workflow —— `witnessloop init` 在目标仓写入的 caller 引用本文件：
#   uses: Xingkai98/witnessloop/.github/workflows/gate.yml@v1
# 本文件刻意极薄：门禁逻辑全在 `witnessloop check` 里（host-agnostic 的单二进制）。
#
# 注意：reusable workflow 不会凭空产生 required check。
# 真正拦住合并的是目标仓 branch protection 里把本 workflow 的 job 勾成 required——
# 那一次人肉操作就是 v1 的「人类签名」（design §4 / §9 风险 3）。

on:
  workflow_call:
    inputs:
      base-ref:
        description: "diff 的 base ref；留空则用 origin/<PR 的 base branch>"
        required: false
        type: string
        default: ""
      witnessloop-ref:
        description: "witnessloop 自身的 ref（钉版本）。**留空 = 自动**：取本 reusable workflow 自己的 commit"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # ⚠️ **第一个 step**：后面的步骤（含失败的）之后也要能在日志里看见本次用的包 ref。
      #
      # 解析规则——**分支顺序即语义**（change gate-ref-pins-package / design §2 D1，
      # 用户 2026-10-16 裁定 (B′)）：
      #   ① 显式 `with.witnessloop-ref` 非空 ⇒ 用它（显式意图优先，不得静默 no-op）；
      #   ② `job.workflow_repository != REPO_SLUG`（含空值：GHES / 非本仓 reusable）
      #      ⇒ **直接 fail-closed 退 `WL_FALLBACK_REF`** + `::warning::`，
      #      **不**再试 `job.workflow_ref`（那会拿别人仓的 ref 去本仓装包）；
      #   ③ 否则 `job.workflow_sha` 非空 ⇒ 用那个 sha（`job.*` 在 called workflow 里指
      #      **被复用的那个 workflow 文件**）；
      #   ④ 否则（repository 已匹配、sha 为空）用 `job.workflow_ref` 的 `@` 之后那段，
      #      只收 `refs/heads/*` 与 `refs/tags/*`；
      #   ⑤ 全不行 ⇒ **fail-closed 退 `WL_FALLBACK_REF`**（= `constants.DEFAULT_GATE_REF`
      #      的 ref 部分，**与出厂默认同源**、随它一起挪；今天 = `v1`）并打 `::warning::`。
      #
      # ⚠️ **不能用 `github.workflow_ref` / `github.workflow_sha`**：跨仓真 CI 探针（run
      # 38853369550）实测它们指 **caller**（接入方自己那份）⇒ 会拿接入方的 ref 去
      # witnessloop 仓装包 ⇒ 全量硬红。只有 `job.*` 唯一确定被复用的那个文件。
      #
      # ⚠️ 解析只能落在 **step** 里：`on.workflow_call.inputs.<id>.default` 的可用上下文
      # 只有 `github, inputs, vars` 三个，`job` 不在其中。
      #
      # ⚠️ 两个「常量」（`WL_REPO_SLUG` / `WL_FALLBACK_REF`）必须与 `constants.py` 的
      # `REPO_SLUG` / `DEFAULT_GATE_REF` 的 ref 部分逐字相同（`tests/test_gate_workflow.py` 钉住）。
      # 另外：`run:` 里**刻意不用** `${{ }}` 插值——既避免把外来的字符串当 workflow 源码，
      # 也让测试能把 `run:` 原文直接交给 `sh` 跑（行为级钉子）。
      - name: resolve witnessloop package ref
        id: wl-ref
        env:
          WL_INPUT_REF: ${{ inputs.witnessloop-ref }}
          WL_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WL_WORKFLOW_SHA: ${{ job.workflow_sha }}
          WL_WORKFLOW_REF: ${{ job.workflow_ref }}
          WL_REPO_SLUG: "Xingkai98/witnessloop"
          WL_FALLBACK_REF: "v1"
        run: |
          set -eu

          REF=""
          WHY=""
          FAILED=""

          # ⚠️ 一律用 `${VAR:-}` 读：本脚本 `set -eu`，而未定义的变量会让它**当场退出**
          # （GitHub 侧上游取不到时会渲染成空串、env 仍然存在，但这不构成可依赖的保证）。
          # 解析器宁可 fail-closed 退兜底 ref 并告警，也不能因为一个没定义的变量而红在一个
          # 与「包版本」毫无相似之处的地方。
          if [ -n "${WL_INPUT_REF:-}" ]; then
            REF="$WL_INPUT_REF"
            WHY="调用方显式传入的 with.witnessloop-ref"
          elif [ "${WL_WORKFLOW_REPOSITORY:-}" != "$WL_REPO_SLUG" ]; then
            FAILED="job.workflow_repository=「${WL_WORKFLOW_REPOSITORY:-<空>}」≠「$WL_REPO_SLUG」（GHES / 别人的仓 / 非本仓 reusable 都落这里）"
          elif [ -n "${WL_WORKFLOW_SHA:-}" ]; then
            REF="$WL_WORKFLOW_SHA"
            WHY="job.workflow_sha（被复用的那个 workflow 文件自己的 commit）"
          else
            case "${WL_WORKFLOW_REF:-}" in
              *@refs/heads/*)
                REF="${WL_WORKFLOW_REF##*@refs/heads/}"
                WHY="job.workflow_ref 的分支名（job.workflow_sha 缺失时的兜底）" ;;
              *@refs/tags/*)
                REF="${WL_WORKFLOW_REF##*@refs/tags/}"
                WHY="job.workflow_ref 的 tag 名（job.workflow_sha 缺失时的兜底）" ;;
              *)
                FAILED="job.workflow_sha 为空、且 job.workflow_ref=「${WL_WORKFLOW_REF:-<空>}」解析不出可安装的 ref" ;;
            esac
          fi

          if [ -n "$FAILED" ]; then
            REF="$WL_FALLBACK_REF"
            WHY="fail-closed：$FAILED"
            echo "::warning::witnessloop 包 ref 解析失败，退到 $REF —— $FAILED"
          fi

          # ⚠️ `$GITHUB_OUTPUT` 刻意**不**兜底（对抗轮 R5 的观察）：它未定义时脚本当场退 2，
          # 那是**响亮**的失败；兜了反而会退化成 `uvx --from git+…@`（装默认分支）——
          # 一条与「包版本钉没钉住」毫无相似之处的**静默错版**。
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "::notice::witnessloop 包 ref = $REF（来源：$WHY）"

      # fetch-depth: 0 是必需的：浅克隆会让 merge-base 求不出来，
      # 而 check 对「求不出 base」是 fail-closed（报错，不静默跳过）。
      #
      # ref 显式钉在 PR 的 head：`pull_request` 事件默认检出 test-merge commit，
      # 那会把 base 侧顺带进来的改动混进 diff 视野。check 自身已经能正确处理
      # merge commit（stray 与 PR 变更集求交），这里再钉一层是纵深防御——
      # 让「被检 revision」就是 PR 自己的 head，语义也更直白。
      # 非 PR 事件没有 pull_request 字段，回落到 github.sha。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: witnessloop check
        env:
          BASE_INPUT: ${{ inputs.base-ref }}
          PR_BASE: ${{ github.base_ref }}
          # 包 ref 由上面那个 step 解析（(B′)：缺省 = 本 reusable workflow 自己的 commit）。
          # 走 env 而不是 `${{ }}` 内联：与 adopter tests 那一步同口径，不在 run 里做解析期插值。
          WL_REF: ${{ steps.wl-ref.outputs.ref }}
        run: |
          if [ -n "$BASE_INPUT" ]; then
            BASE="$BASE_INPUT"
          else
            BASE="origin/$PR_BASE"
          fi
          uvx --from \
            "git+https://github.com/Xingkai98/witnessloop@$WL_REF" \
            witnessloop check --root . --base "$BASE" --head HEAD

      # 接入方的测试执行点：`init` 写的命令文件（内容 = 一行 shell 命令）。
      # 与上面的 `check` **同一个 job** ⇒ 复用已 required 的 `gate / check`，接入方
      # **不需要**任何新增平台操作就能让「测试失败 = 合不了」成立。
      #
      # `if: !cancelled()`：① 门禁红的时候**最需要**测试反馈（一次 CI 里同时看到
      # 「缺必需件」与 pytest 失败明细）；② run 被取消时不必再跑一遍。（默认语义会在
      # `check` 红时**完全不跑**测试；`always()` 会连取消的 run 一起跑。曾有说法称
      # `always()` 会「掩蔽」`check` 的失败——**实测为假**：失败步骤 + 后续 skipped 步骤
      # ⇒ job 结论仍 `failure`，真正的掩蔽开关是 `continue-on-error`。）
      #
      # ⚠️ 文件**路径**经 `env:` 传入、命令在 `run:` 里**运行时读**：`${{ }}` 插值是
      # **解析期**发生的，对文件内容做插值等于把接入方内容当 workflow 源码。
      # ⚠️ 这里的两个字面量必须与 `constants.py` 的 `ADOPTER_TESTS_PATH` /
      # `ADOPTER_TESTS_SENTINEL` **逐字相同**（由 tests/test_gate_workflow.py 钉住）——
      # 口径分裂的后果是「`check` 判红、门禁却静默跳过」（或反过来）。
      #
      # 文件缺失 **或** 内容含哨兵 ⇒ 跳过（是否判红由 `check` 决定）：哨兵会被 `sh`
      # 当命令执行，症状是 `sh: Syntax error`（实测 exit 2），与「没接线」毫无相似之处。
      # ⚠️ 读取时顺带 `tr -d '\r'`：`$(cat …)` **只吃行尾 `\n`**，CRLF 会把一个 `\r` 留在
      # 命令尾 ⇒ `sh -c "uv run pytest -q\r"` 报 `pytest: error: unrecognized arguments:`
      # （实测 exit 4）。`check` 侧不受影响（Python 的 `str.strip()` 本来就吃 `\r`），
      # 所以那是门禁侧独有的、与「接线」毫无关系的红（审阅 R1 的 I3）。
      - name: adopter tests
        if: ${{ !cancelled() }}
        env:
          WL_TESTS_FILE: .github/witnessloop-tests.txt
          WL_TESTS_SENTINEL: "<<REPLACE-ME>>"
        run: |
          if [ ! -f "$WL_TESTS_FILE" ]; then
            echo "::notice::没有测试执行点（$WL_TESTS_FILE 不存在），跳过。"
            exit 0
          fi
          CMD=$(tr -d '\r' < "$WL_TESTS_FILE")
          case "$CMD" in
            *"$WL_TESTS_SENTINEL"*)
              echo "::notice::测试执行点未接线（仍是哨兵），跳过。"
              exit 0
              ;;
          esac
          sh -c "$CMD"
