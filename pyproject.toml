[project]
name = "witnessloop"
version = "0.1.0"
description = "把 agent 写代码的「证据」绑进 CI required check 的机械门禁"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
witnessloop = "witnessloop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/witnessloop"]

[dependency-groups]
# pyyaml 给 test_gate_workflow.py 解析 workflow 用——只 grep 子串钉不住
# `with.ref` 这种「位置 + 取值」都重要的行。
dev = ["pytest>=8", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 不在 addopts 里预置 -q：`uv run pytest -q` 再叠一层会把汇总也静默掉，
# 让人看不到 "N passed"（reviewer §1.0 踩过）。
addopts = ""
